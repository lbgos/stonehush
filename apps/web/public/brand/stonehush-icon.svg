<title id="title">Stonehush merged SH monogram</title>
<desc id="desc">Close-set SH with a smoothly curved custom S and a diagonal gray gradient. The same coherent edge-noise algorithm breaks the inward strokes into square fragments, with a sparse halo confined to the shared center. Outer contours remain intact.</desc>
