<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/stonehush-icon.svg" />
    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        let preference = "system";
        let family = "smoked";
        const families = ["smoked", "void", "instrument", "grove", "ember", "iris"];
        try {
          const stored = localStorage.getItem("stonehush.theme");
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
          const storedFamily = localStorage.getItem("stonehush.themeFamily");
          if (storedFamily && families.includes(storedFamily)) family = storedFamily;
        } catch {}
        const resolved =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.themeFamily = family;
        document.documentElement.style.colorScheme = resolved;

        const number = (key, fallback) => {
          try {
            const stored = localStorage.getItem(key);
            if (stored === null || stored.trim() === "") return fallback;
            const value = Number(stored);
            return Number.isFinite(value) ? value : fallback;
          } catch {
            return fallback;
          }
        };
        const boolean = (key, fallback) => {
          try {
            const value = localStorage.getItem(key);
            return value === "true" ? true : value === "false" ? false : fallback;
          } catch {
            return fallback;
          }
        };
        const clamp = (value, minimum, maximum) => Math.min(Math.max(value, minimum), maximum);
        const sidebarWidth = clamp(
          number("stonehush.layout.sidebar.width", 256),
          208,
          Math.max(208, innerWidth - 640),
        );
        const consoleHeight = clamp(
          number("stonehush.layout.console.height", 320),
          220,
          Math.max(220, innerHeight * 0.6),
        );
        document.documentElement.dataset.sidebarOpen = String(
          boolean("stonehush.layout.sidebar.open", true),
        );
        document.documentElement.style.setProperty("--shell-sidebar-width", `${sidebarWidth}px`);
        document.documentElement.style.setProperty("--shell-console-height", `${consoleHeight}px`);
      })();
    </script>
    <title>Stonehush</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
