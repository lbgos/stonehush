name: Packaging acceptance

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.check-name }}
    runs-on: ${{ matrix.host }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            release: '24.04'
            check-name: Exact-head image acceptance
          - host: ubuntu-22.04
            release: '22.04'
            check-name: Exact-head image acceptance (Ubuntu 22.04)
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      BUILDX_BUILDER: stonehush-acceptance
      EXPECTED_UBUNTU_RELEASE: ${{ matrix.release }}
    steps:
      - name: Check out the PR source, not its merge ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up the pinned runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0

      - name: Prepare the disposable builder
        run: |
          test "$(df -B1 --output=avail . | tail -1)" -gt 12000000000
          test "$(node --version)" = v24.18.0
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          docker buildx create --name stonehush-acceptance --driver docker-container --driver-opt memory=4g,cpu-period=100000,cpu-quota=200000 --use
          mkdir -m 700 "$RUNNER_TEMP/stonehush-results"
          mkdir -m 700 "$RUNNER_TEMP/stonehush-results/acceptance"

      - name: Record the actual build host
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { writeFile } from 'node:fs/promises';
          import { observePackagingHost } from './scripts/acceptance-real-tools-assertions.mjs';
          const revision = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(revision, process.env.PR_HEAD);
          const tree = execFileSync('git', ['rev-parse', `${revision}^{tree}`], { encoding: 'utf8' }).trim();
          await writeFile(`${process.env.RUNNER_TEMP}/stonehush-results/build-host.json`, `${JSON.stringify({ revision, tree, host: await observePackagingHost() }, null, 2)}\n`, { flag: 'wx', mode: 0o600 });
          NODE
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Build and export the exact committed image
        timeout-minutes: 20
        env:
          STONEHUSH_BUILD_HOST_RECEIPT: ${{ runner.temp }}/stonehush-results/build-host.json
        run: timeout 1200 node scripts/build-control-plane.mjs stonehush-acceptance:local "$RUNNER_TEMP/control-plane.tar"

      - name: Build the matching native runner
        timeout-minutes: 20
        run: |
          sudo systemd-run --scope -p MemoryMax=4G -p CPUQuota=200% sudo -u "#$(id -u)" -g "#$(id -g)" env "PATH=$PATH" NODE_OPTIONS=--max-old-space-size=3072 timeout 1200 pnpm install --frozen-lockfile
          sudo systemd-run --scope -p MemoryMax=4G -p CPUQuota=200% sudo -u "#$(id -u)" -g "#$(id -g)" env "PATH=$PATH" NODE_OPTIONS=--max-old-space-size=3072 timeout 1200 pnpm --filter @stonehush/runner... run build

      - name: Build the exact committed native service archive
        timeout-minutes: 20
        env:
          STONEHUSH_BUILD_HOST_RECEIPT: ${{ runner.temp }}/stonehush-results/build-host.json
        run: sudo systemd-run --scope -p MemoryMax=4G -p CPUQuota=200% sudo -u "#$(id -u)" -g "#$(id -g)" env "PATH=$PATH" NODE_OPTIONS=--max-old-space-size=3072 "STONEHUSH_BUILD_HOST_RECEIPT=$STONEHUSH_BUILD_HOST_RECEIPT" timeout 1200 node scripts/build-native-runner.mjs "$RUNNER_TEMP/native-runner.tar.gz"

      - name: Bind artifact digests to the recorded build host
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const read = async (name) => JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/${name}`, 'utf8'));
          const build = await read('stonehush-results/build-host.json');
          const image = await read('control-plane.tar.json');
          const native = await read('native-runner.tar.gz.json');
          for (const artifact of [image, native]) {
            assert.equal(artifact.revision, build.revision);
            assert.equal(artifact.tree, build.tree);
          }
          await writeFile(`${process.env.RUNNER_TEMP}/stonehush-results/build-artifacts.json`, `${JSON.stringify({ ...build, image, native }, null, 2)}\n`, { flag: 'wx', mode: 0o600 });
          NODE

      - name: Independently verify and retain the artifact supply-chain packets
        timeout-minutes: 4
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { cp, mkdir, mkdtemp, readFile, rm } from 'node:fs/promises';
          import path from 'node:path';
          import { imagePacket, verifyPacket, walkFiles } from './scripts/release-inventory.mjs';
          const root = process.env.RUNNER_TEMP;
          const host = JSON.parse(await readFile(`${root}/stonehush-results/build-host.json`, 'utf8'));
          const image = JSON.parse(await readFile(`${root}/control-plane.tar.json`, 'utf8'));
          const native = JSON.parse(await readFile(`${root}/native-runner.tar.gz.json`, 'utf8'));
          const destination = `${root}/stonehush-results/supply-chain`;
          await mkdir(destination, { mode: 0o700 });
          const temporary = await mkdtemp(`${root}/stonehush-packet-verify-`);
          try {
            // Re-extract the final native archive independently of its builder.
            execFileSync('tar', ['-xzf', `${root}/native-runner.tar.gz`, '-C', temporary], { timeout: 60000 });
            const nativeResult = await verifyPacket(`${root}/native-runner.tar.gz.supply-chain`, `${temporary}/stonehush-runner`, `${root}/native-runner.tar.gz`, native, host);
            // Re-copy the immutable final image and verify every original packet byte.
            const imageResult = await imagePacket(image.imageId, `${root}/control-plane.tar`, image, host, `${root}/control-plane.tar.supply-chain`, true);
            for (const [name, source] of [['control-plane', `${root}/control-plane.tar.supply-chain`], ['native-runner', `${root}/native-runner.tar.gz.supply-chain`]]) {
              for (const member of await walkFiles(source)) {
                assert.ok(['sbom.spdx.json', 'inventory.json', 'components.json', 'system.json', 'SHA256SUMS'].includes(member) || /^notices\/[a-f0-9]{64}\.txt$/.test(member), 'Unexpected supply-chain retention member.');
                await mkdir(path.dirname(`${destination}/${name}/${member}`), { recursive: true });
                await cp(`${source}/${member}`, `${destination}/${name}/${member}`, { errorOnExist: true, force: false });
              }
            }
            console.log(JSON.stringify({ imageResult, nativeResult, redistribution: 'NOT CLEARED', source: host.revision, tree: host.tree, imageId: image.imageId }));
          } finally { await rm(temporary, { recursive: true, force: true }); }
          NODE

      - name: Exercise the loaded image, native runner and recovery
        timeout-minutes: 12
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: timeout 660 node scripts/accept-control-plane.mjs "$RUNNER_TEMP/control-plane.tar" "$RUNNER_TEMP/stonehush-results/acceptance"

      - name: Exercise the packaged native user service on this disposable host
        timeout-minutes: 8
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: timeout 420 node scripts/accept-native-service.mjs "$RUNNER_TEMP/control-plane.tar" "$RUNNER_TEMP/native-runner.tar.gz" "$RUNNER_TEMP/stonehush-results/acceptance"

      - name: Install distribution tool prerequisites on this disposable VM
        timeout-minutes: 4
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo timeout 120 apt-get update
          sudo timeout 120 apt-get install --no-install-recommends -y nmap ffuf
          test -x /usr/bin/nmap
          test -x /usr/bin/ffuf

      - name: Exercise the packaged workflow with real distribution tools
        timeout-minutes: 8
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: sudo systemd-run --scope -p MemoryMax=4G -p CPUQuota=200% sudo -u "#$(id -u)" -g "#$(id -g)" env "PATH=$PATH" GITHUB_ACTIONS=true "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" "EXPECTED_REVISION=$EXPECTED_REVISION" "EXPECTED_UBUNTU_RELEASE=$EXPECTED_UBUNTU_RELEASE" NODE_OPTIONS=--max-old-space-size=3072 timeout 420 node scripts/accept-real-tools.mjs "$RUNNER_TEMP/control-plane.tar" "$RUNNER_TEMP/native-runner.tar.gz" "$RUNNER_TEMP/stonehush-results/acceptance"

      - name: Retain only synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-plane-acceptance-${{ matrix.host }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/stonehush-results/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

      - name: Remove the owned disposable builder
        if: always()
        run: docker buildx rm stonehush-acceptance
